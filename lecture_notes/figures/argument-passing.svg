<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="798" height="378" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="400" y1="25" x2="400" y2="355" stroke="#E5E7EB" stroke-width="2"/>

  <!-- ============ LEFT: immutable int, rebinding ============ -->
  <text x="200" y="38" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="middle">Rebinding a parameter</text>
  <text x="200" y="60" font-size="13.5" fill="#374151" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">x = 10;  tweak(x)  # inside: a = 20</text>

  <!-- frames -->
  <rect x="25" y="80" width="160" height="90" rx="10" fill="none" stroke="#9CA3AF" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="35" y="98" font-size="12" fill="#6B7280">caller</text>
  <rect x="25" y="195" width="160" height="100" rx="10" fill="none" stroke="#9CA3AF" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="35" y="213" font-size="12" fill="#6B7280">inside tweak()</text>

  <g font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#7A4100" text-anchor="middle">
    <rect x="55" y="110" width="100" height="40" rx="10" fill="#FFF4E0" stroke="#E8890C" stroke-width="2.5"/>
    <text x="105" y="137">x</text>
    <rect x="55" y="230" width="100" height="40" rx="10" fill="#FFF4E0" stroke="#E8890C" stroke-width="2.5"/>
    <text x="105" y="257">a</text>
  </g>
  <rect x="270" y="100" width="100" height="56" rx="12" fill="#E8F1FD" stroke="#2E6FD8" stroke-width="2.5"/>
  <text x="320" y="136" font-size="22" font-weight="bold" fill="#123A73" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">10</text>
  <rect x="270" y="225" width="100" height="56" rx="12" fill="#E8F1FD" stroke="#2E6FD8" stroke-width="2.5"/>
  <text x="320" y="261" font-size="22" font-weight="bold" fill="#123A73" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">20</text>

  <line x1="157" y1="130" x2="266" y2="128" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="157" y1="242" x2="266" y2="148" stroke="#9CA3AF" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arrGrey)"/>
  <line x1="157" y1="253" x2="266" y2="253" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="232" y="214" font-size="11.5" fill="#6B7280" font-style="italic">at the call</text>
  <text x="212" y="290" font-size="11.5" fill="#374151" font-style="italic">after a = 20</text>

  <text x="200" y="330" font-size="13.5" fill="#14532D" text-anchor="middle">Only the local name a moves;</text>
  <text x="200" y="348" font-size="13.5" fill="#14532D" text-anchor="middle">x in the caller still refers to 10.</text>

  <!-- ============ RIGHT: mutable list, mutation ============ -->
  <text x="600" y="38" font-size="16" font-weight="bold" fill="#1F2937" text-anchor="middle">Mutating a shared object</text>
  <text x="600" y="60" font-size="13.5" fill="#374151" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">greeting(people)  # inside: names[0] = …</text>

  <rect x="420" y="80" width="160" height="90" rx="10" fill="none" stroke="#9CA3AF" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="430" y="98" font-size="12" fill="#6B7280">caller</text>
  <rect x="420" y="195" width="160" height="100" rx="10" fill="none" stroke="#9CA3AF" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="430" y="213" font-size="12" fill="#6B7280">inside greeting()</text>

  <g font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#7A4100" text-anchor="middle">
    <rect x="445" y="110" width="110" height="40" rx="10" fill="#FFF4E0" stroke="#E8890C" stroke-width="2.5"/>
    <text x="500" y="137">people</text>
    <rect x="445" y="230" width="110" height="40" rx="10" fill="#FFF4E0" stroke="#E8890C" stroke-width="2.5"/>
    <text x="500" y="257">names</text>
  </g>
  <rect x="625" y="160" width="160" height="70" rx="12" fill="#E8F1FD" stroke="#2E6FD8" stroke-width="2.5"/>
  <text x="705" y="190" font-size="13" fill="#123A73" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">['Fred', 'Anna',</text>
  <text x="705" y="208" font-size="13" fill="#123A73" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"> 'Bob']</text>
  <text x="705" y="250" font-size="12" fill="#123A73" text-anchor="middle">one list object</text>

  <line x1="557" y1="130" x2="621" y2="178" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="557" y1="250" x2="621" y2="212" stroke="#374151" stroke-width="2.5" marker-end="url(#arr)"/>

  <text x="600" y="330" font-size="13.5" fill="#9A3412" text-anchor="middle">Both names refer to the same list, so a change</text>
  <text x="600" y="348" font-size="13.5" fill="#9A3412" text-anchor="middle">made inside the function is seen by the caller.</text>
</svg>
