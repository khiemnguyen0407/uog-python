<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="778" height="328" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
  <line x1="390" y1="25" x2="390" y2="305" stroke="#E5E7EB" stroke-width="2"/>

  <!-- LEFT: alias -->
  <text x="195" y="40" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Alias</text>
  <text x="195" y="64" font-size="14" fill="#374151" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">list_alias = number_list</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#7A4100" text-anchor="middle">
    <rect x="25" y="105" width="135" height="40" rx="10" fill="#FFF4E0" stroke="#E8890C" stroke-width="2.5"/>
    <text x="92" y="131">number_list</text>
    <rect x="25" y="200" width="135" height="40" rx="10" fill="#FFF4E0" stroke="#E8890C" stroke-width="2.5"/>
    <text x="92" y="226">list_alias</text>
  </g>
  <rect x="215" y="142" width="160" height="60" rx="12" fill="#E8F1FD" stroke="#2E6FD8" stroke-width="2.5"/>
  <text x="295" y="171" font-size="14" fill="#123A73" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">[5.5, 6.5, …]</text>
  <text x="295" y="190" font-size="12" fill="#123A73" text-anchor="middle">one list object</text>
  <g stroke="#374151" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <line x1="162" y1="125" x2="212" y2="158"/>
    <line x1="162" y1="220" x2="212" y2="188"/>
  </g>
  <text x="195" y="285" font-size="13.5" fill="#9A3412" text-anchor="middle">A change made through one name</text>
  <text x="195" y="303" font-size="13.5" fill="#9A3412" text-anchor="middle">is visible through the other.</text>

  <!-- RIGHT: copy -->
  <text x="585" y="40" font-size="17" font-weight="bold" fill="#1F2937" text-anchor="middle">Copy</text>
  <text x="585" y="64" font-size="14" fill="#374151" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">list_copy = number_list.copy()</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#7A4100" text-anchor="middle">
    <rect x="410" y="105" width="135" height="40" rx="10" fill="#FFF4E0" stroke="#E8890C" stroke-width="2.5"/>
    <text x="477" y="131">number_list</text>
    <rect x="410" y="200" width="135" height="40" rx="10" fill="#FFF4E0" stroke="#E8890C" stroke-width="2.5"/>
    <text x="477" y="226">list_copy</text>
  </g>
  <rect x="595" y="95" width="160" height="60" rx="12" fill="#E8F1FD" stroke="#2E6FD8" stroke-width="2.5"/>
  <text x="675" y="124" font-size="14" fill="#123A73" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">[5.5, 6.5, …]</text>
  <text x="675" y="143" font-size="12" fill="#123A73" text-anchor="middle">original</text>
  <rect x="595" y="190" width="160" height="60" rx="12" fill="#E6F6EC" stroke="#2E9E5B" stroke-width="2.5"/>
  <text x="675" y="219" font-size="14" fill="#14532D" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">[5.5, 6.5, …]</text>
  <text x="675" y="238" font-size="12" fill="#14532D" text-anchor="middle">independent copy</text>
  <g stroke="#374151" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <line x1="547" y1="125" x2="592" y2="125"/>
    <line x1="547" y1="220" x2="592" y2="220"/>
  </g>
  <text x="585" y="285" font-size="13.5" fill="#14532D" text-anchor="middle">Two separate objects: changing</text>
  <text x="585" y="303" font-size="13.5" fill="#14532D" text-anchor="middle">one does not affect the other.</text>
</svg>
