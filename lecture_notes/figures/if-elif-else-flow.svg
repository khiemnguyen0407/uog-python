<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" width="720" height="640" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="718" height="638" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>

  <!-- start -->
  <rect x="165" y="20" width="170" height="44" rx="22" fill="#1F2937"/>
  <text x="250" y="48" font-size="16" fill="#F9FAFB" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">marks = 70</text>

  <!-- decisions -->
  <g stroke="#E8890C" stroke-width="2.5" fill="#FFF4E0">
    <polygon points="250,100 360,140 250,180 140,140"/>
    <polygon points="250,220 360,260 250,300 140,260"/>
    <polygon points="250,340 360,380 250,420 140,380"/>
  </g>
  <g font-size="15" fill="#7A4100" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">
    <text x="250" y="145">marks &lt;= 50 ?</text>
    <text x="250" y="265">marks &lt;= 59 ?</text>
    <text x="250" y="385">marks &lt;= 69 ?</text>
  </g>

  <!-- result boxes -->
  <g stroke="#2E6FD8" stroke-width="2.5" fill="#E8F1FD">
    <rect x="450" y="117" width="150" height="46" rx="10"/>
    <rect x="450" y="237" width="150" height="46" rx="10"/>
    <rect x="450" y="357" width="150" height="46" rx="10"/>
    <rect x="175" y="460" width="150" height="46" rx="10"/>
  </g>
  <g font-size="16" fill="#123A73" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">
    <text x="525" y="146">grade = 'D'</text>
    <text x="525" y="266">grade = 'C'</text>
    <text x="525" y="386">grade = 'B'</text>
    <text x="250" y="489">grade = 'A'</text>
  </g>

  <!-- print box -->
  <rect x="165" y="560" width="170" height="46" rx="10" fill="#E6F6EC" stroke="#2E9E5B" stroke-width="2.5"/>
  <text x="250" y="589" font-size="16" fill="#14532D" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">print(grade)</text>

  <!-- arrows -->
  <g stroke="#374151" stroke-width="2.2" fill="none" marker-end="url(#arr)">
    <line x1="250" y1="64" x2="250" y2="98"/>
    <line x1="250" y1="180" x2="250" y2="218"/>
    <line x1="250" y1="300" x2="250" y2="338"/>
    <line x1="250" y1="420" x2="250" y2="458"/>
    <line x1="250" y1="506" x2="250" y2="558"/>
    <line x1="360" y1="140" x2="448" y2="140"/>
    <line x1="360" y1="260" x2="448" y2="260"/>
    <line x1="360" y1="380" x2="448" y2="380"/>
    <polyline points="660,583 337,583"/>
  </g>
  <g stroke="#374151" stroke-width="2.2" fill="none">
    <polyline points="600,140 660,140 660,583"/>
    <line x1="600" y1="260" x2="660" y2="260"/>
    <line x1="600" y1="380" x2="660" y2="380"/>
  </g>

  <!-- labels -->
  <g font-size="14" font-weight="bold">
    <text x="375" y="130" fill="#2E9E5B">True</text>
    <text x="375" y="250" fill="#2E9E5B">True</text>
    <text x="375" y="370" fill="#2E9E5B">True</text>
    <text x="260" y="204" fill="#C2410C">False</text>
    <text x="260" y="324" fill="#C2410C">False</text>
    <text x="260" y="444" fill="#C2410C">False</text>
  </g>
  <g font-size="13" fill="#6B7280" font-style="italic">
    <text x="30" y="145">if</text>
    <text x="30" y="265">elif</text>
    <text x="30" y="385">elif</text>
    <text x="30" y="489">else</text>
  </g>
</svg>
